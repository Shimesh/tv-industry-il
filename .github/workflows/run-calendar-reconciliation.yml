name: Run Calendar Reconciliation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/run-calendar-reconciliation.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser sync dependencies
        run: npm install firebase-admin puppeteer-core @sparticuz/chromium
      - name: Reconcile saved calendars
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SYNC_SAVED_CALENDARS: '1'
        run: node scripts/fetch-schedules.js
