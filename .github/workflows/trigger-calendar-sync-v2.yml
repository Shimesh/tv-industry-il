name: Trigger Calendar Sync V2

on:
  issues:
    types: [opened]

permissions:
  actions: write

jobs:
  dispatch:
    if: github.event.issue.title == 'dispatch-calendar-reconciliation-v2.8.87'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch calendar reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-calendar.yml --repo Shimesh/tv-industry-il --ref master
