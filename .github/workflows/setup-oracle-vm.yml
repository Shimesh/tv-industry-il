name: Setup Oracle VM Ratings Sync

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy scripts and configure cron
        run: |
          ssh -i ~/.ssh/oracle_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" \
              "bash -s" << 'REMOTE'
          set -e
          mkdir -p ~/ratings-scraper
          cd ~/ratings-scraper

          curl -fsSL "https://raw.githubusercontent.com/Shimesh/tv-industry-il/master/scripts/scrape-ratings-oracle.mjs" -o scrape-ratings-oracle.mjs
          curl -fsSL "https://raw.githubusercontent.com/Shimesh/tv-industry-il/master/scripts/oracle-sync-trigger.mjs" -o oracle-sync-trigger.mjs
          echo "Scripts downloaded"

          node -e "require('firebase-admin')" 2>/dev/null || npm install firebase-admin cheerio
          echo "npm OK"

          if crontab -l 2>/dev/null | grep -qF "oracle-sync-trigger"; then
            echo "Cron already present"
          else
            (crontab -l 2>/dev/null; echo "*/5 * * * * cd ~/ratings-scraper && node oracle-sync-trigger.mjs >> ~/sync-trigger.log 2>&1") | crontab -
            echo "Cron added"
          fi
          crontab -l
          REMOTE

      - name: Check Herzliya connectivity from Oracle
        run: |
          ssh -i ~/.ssh/oracle_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" \
              "curl -4 -k -sS -o /dev/null -w 'Herzliya HTTP %{http_code} connect=%{time_connect}s total=%{time_total}s\n' --connect-timeout 12 --max-time 20 https://hsil.acc.co.il:5443/"

      - name: Write .env and run scraper
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          ssh -i ~/.ssh/oracle_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" \
              "cat > ~/ratings-scraper/.env" << ENVEOF
          FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          FIREBASE_CLIENT_EMAIL=$FIREBASE_CLIENT_EMAIL
          FIREBASE_PRIVATE_KEY=$FIREBASE_PRIVATE_KEY
          ENVEOF

          ssh -i ~/.ssh/oracle_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" \
              "cd ~/ratings-scraper && FORCE_WEEKLY=1 node scrape-ratings-oracle.mjs"
