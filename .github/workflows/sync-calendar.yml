name: Sync Calendar (Hourly)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-calendar.yml'
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser sync dependencies
        run: npm install firebase-admin puppeteer-core @sparticuz/chromium

      - name: Enforce safe visible-shift calendar sync
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/fetch-schedules.js';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(
            "const chromium = require('@sparticuz/chromium');",
            "const chromiumModule = require('@sparticuz/chromium');\nconst chromium = chromiumModule.default || chromiumModule;",
          );
          source = source.replace(
            'await cleanupWeek(userProductionsRoot, weekId);',
            "console.log('Preserving existing productions for week ' + weekId + '; sync is merge-only');",
          );
          source = source.replace(/\s*if \(!herzliyaId\) return;\r?\n/, '\n');
          if (!source.includes('function createVisibleProductionId(')) {
            const helper = [
              'function createVisibleProductionId(production) {',
              "  const key = [production.name || '', production.date || '', production.studio || '', production.startTime || ''].join('::').toLowerCase();",
              '  let hash = 0;',
              '  for (let i = 0; i < key.length; i++) {',
              '    hash = ((hash << 5) - hash) + key.charCodeAt(i);',
              '    hash |= 0;',
              '  }',
              "  return 'visible-' + Math.abs(hash).toString(36);",
              '}',
              '',
            ].join('\n');
            source = source.replace('async function saveSchedule(', helper + 'async function saveSchedule(');
          }
          source = source.replace(
            "    const prodId = String(prod.herzliyaId);\n    if (!prodId || prodId === '0') continue;",
            '    const prodId = String(prod.herzliyaId || createVisibleProductionId(prod));',
          );
          source = source.replace(
            'main().catch(console.error);',
            "main().catch((error) => { console.error(error); process.exitCode = 1; });",
          );
          if (source.includes('await cleanupWeek(userProductionsRoot, weekId);')) throw new Error('Destructive cleanup remains');
          if (source.includes('if (!herzliyaId) return;')) throw new Error('Visible shifts are still discarded');
          if (!source.includes('createVisibleProductionId(prod)')) throw new Error('Visible production ID patch failed');
          fs.writeFileSync(file, source);
          NODE
          node --check scripts/fetch-schedules.js

      - name: Persist importer fix
        shell: bash
        run: |
          if git diff --quiet -- scripts/fetch-schedules.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fetch-schedules.js
          git commit -m "fix(calendar): import visible shifts without popup ids"
          git push

      - name: Sync saved calendars with browser
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SYNC_SAVED_CALENDARS: '1'
        run: node scripts/fetch-schedules.js
