name: Sync Calendar (Hourly)

on:
  schedule:
    - cron: '0 * * * *'  # every hour at :00
  workflow_dispatch:

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync all saved calendars via API
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://tv-industry-il.vercel.app/api/admin/sync-all-calendars" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 90)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status: $body"
          if [ "$status" != "200" ]; then
            echo "Sync API returned HTTP $status"
            exit 1
          fi
