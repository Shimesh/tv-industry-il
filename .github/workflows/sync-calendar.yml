name: Sync Calendar (Hourly)

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-calendar.yml'
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser sync dependencies
        run: npm install firebase-admin puppeteer-core @sparticuz/chromium

      - name: Enforce non-destructive calendar sync
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/fetch-schedules.js';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace(
            "const chromium = require('@sparticuz/chromium');",
            "const chromiumModule = require('@sparticuz/chromium');\nconst chromium = chromiumModule.default || chromiumModule;",
          );
          source = source.replace(
            'await cleanupWeek(userProductionsRoot, weekId);',
            "console.log(`Preserving existing productions for week ${weekId}; sync is merge-only`);",
          );
          source = source.replace(
            'main().catch(console.error);',
            "main().catch((error) => { console.error(error); process.exitCode = 1; });",
          );
          if (source.includes('await cleanupWeek(userProductionsRoot, weekId);')) {
            throw new Error('Destructive cleanup call is still present');
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Sync saved calendars with browser
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SYNC_SAVED_CALENDARS: '1'
        run: node scripts/fetch-schedules.js
