name: Sync Calendar (Manual Fallback)

on:
  # Manual cloud trigger only. Herzliya currently times out from GitHub/Vercel cloud IPs.
  workflow_dispatch:

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Trigger Vercel calendar sync cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/poll-calendar-sync-cron.mjs
