name: Release Calendar Crew Recovery 2.8.95

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-2.8.95.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Patch, validate, and build
        run: |
          node scripts/release-2.8.95.js
          npm version 2.8.95 --no-git-tag-version
          npm --prefix realtime-server version 2.8.95 --no-git-tag-version
          node --check scripts/fetch-schedules.js
          npm run build
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fetch-schedules.js src/components/Footer.tsx package.json package-lock.json realtime-server/package.json
          git commit -m "fix(calendar): restore department crews in v2.8.95"
          git push
      - name: Sync saved calendars
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SYNC_SAVED_CALENDARS: '1'
        run: node scripts/fetch-schedules.js
