name: Apply Calendar Reliability Hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/calendar-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply calendar client refresh and version sync
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = '2.8.86';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = version;
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');

          const realtime = JSON.parse(fs.readFileSync('realtime-server/package.json', 'utf8'));
          realtime.version = version;
          fs.writeFileSync('realtime-server/package.json', JSON.stringify(realtime, null, 2) + '\n');

          const footerPath = 'src/components/Footer.tsx';
          let footer = fs.readFileSync(footerPath, 'utf8');
          footer = footer.replace(/v\d+\.\d+\.\d+/, `v${version}`);
          fs.writeFileSync(footerPath, footer);

          const widgetPath = 'src/components/WeeklyCalendarWidget.tsx';
          let widget = fs.readFileSync(widgetPath, 'utf8');
          if (!widget.includes('const refreshInterval = window.setInterval(refreshIfVisible')) {
            const marker = `    return () => {
      cancelled = true;
    };`;
            const replacement = `    const refreshIfVisible = () => {
      if (document.visibilityState === 'visible') {
        void fetchGlobalWeek().catch(() => {
          // Keep cached data if the network fails.
        });
      }
    };
    const refreshInterval = window.setInterval(refreshIfVisible, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', refreshIfVisible);
    window.addEventListener('focus', refreshIfVisible);

    return () => {
      cancelled = true;
      window.clearInterval(refreshInterval);
      document.removeEventListener('visibilitychange', refreshIfVisible);
      window.removeEventListener('focus', refreshIfVisible);
    };`;
            if (!widget.includes(marker)) throw new Error('WeeklyCalendarWidget cleanup marker not found');
            widget = widget.replace(marker, replacement);
            fs.writeFileSync(widgetPath, widget);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json realtime-server/package.json src/components/Footer.tsx src/components/WeeklyCalendarWidget.tsx
          git commit -m "fix: refresh calendar client automatically in v2.8.86"
          git pull --rebase origin master
          git push origin master
