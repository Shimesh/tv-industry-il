name: Apply Calendar Sync Hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/calendar-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply calendar reliability fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = '2.8.86';

          const updateJsonVersion = (path, updateLockRoot = false) => {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            data.version = version;
            if (updateLockRoot && data.packages?.['']) data.packages[''].version = version;
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          };

          updateJsonVersion('package.json');
          updateJsonVersion('package-lock.json', true);
          updateJsonVersion('realtime-server/package.json');

          const footerPath = 'src/components/Footer.tsx';
          const footer = fs.readFileSync(footerPath, 'utf8').replace(/v2\.8\.\d+/, `v${version}`);
          fs.writeFileSync(footerPath, footer);

          const vercelPath = 'vercel.json';
          const vercel = JSON.parse(fs.readFileSync(vercelPath, 'utf8'));
          const calendarCron = vercel.crons.find((cron) => cron.path === '/api/cron/sync-calendar');
          if (!calendarCron) throw new Error('Calendar cron not found');
          calendarCron.schedule = '47 * * * *';
          fs.writeFileSync(vercelPath, JSON.stringify(vercel, null, 2) + '\n');

          const widgetPath = 'src/components/WeeklyCalendarWidget.tsx';
          let widget = fs.readFileSync(widgetPath, 'utf8');
          const oldCleanup = `    return () => {\n      cancelled = true;\n    };`;
          const newCleanup = `    const refreshIfVisible = () => {\n      if (document.visibilityState === 'visible') {\n        void fetchGlobalWeek().catch(() => {\n          // Keep cached data if the network fails.\n        });\n      }\n    };\n    const refreshInterval = window.setInterval(refreshIfVisible, 5 * 60 * 1000);\n    document.addEventListener('visibilitychange', refreshIfVisible);\n\n    return () => {\n      cancelled = true;\n      window.clearInterval(refreshInterval);\n      document.removeEventListener('visibilitychange', refreshIfVisible);\n    };`;
          if (!widget.includes('const refreshInterval = window.setInterval(refreshIfVisible')) {
            if (!widget.includes(oldCleanup)) throw new Error('Widget refresh insertion point not found');
            widget = widget.replace(oldCleanup, newCleanup);
            fs.writeFileSync(widgetPath, widget);
          }
          NODE

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json realtime-server/package.json src/components/Footer.tsx src/components/WeeklyCalendarWidget.tsx vercel.json
          git commit -m "fix: add hourly calendar fallback and live refresh in v2.8.86"
          git push origin master
