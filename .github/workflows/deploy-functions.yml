name: Deploy Firebase Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: cd functions && npm install

      - name: Create service account key
        env:
          FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY:  ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          node -e "
            const pk = (process.env.FIREBASE_PRIVATE_KEY || '').replace(/\\\\n/g, '\n');
            const key = {
              type: 'service_account',
              project_id: process.env.FIREBASE_PROJECT_ID,
              private_key_id: 'ci',
              private_key: pk,
              client_email: process.env.FIREBASE_CLIENT_EMAIL,
              client_id: '',
              auth_uri: 'https://accounts.google.com/o/oauth2/auth',
              token_uri: 'https://oauth2.googleapis.com/token',
              auth_provider_x509_cert_url: 'https://www.googleapis.com/oauth2/v1/certs',
            };
            require('fs').writeFileSync('/tmp/sa-key.json', JSON.stringify(key));
            console.log('Key created for', process.env.FIREBASE_CLIENT_EMAIL);
            const written = require('fs').readFileSync('/tmp/sa-key.json', 'utf8');
            const parsed = JSON.parse(written);
            console.log('private_key starts with:', parsed.private_key.slice(0, 40));
          "

      - name: Deploy Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          npx firebase-tools deploy --only functions \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive \
            --debug 2>&1 | tail -50
