name: Release Authoritative Crew Protection 2.8.97

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-2.8.97.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: |
          node scripts/release-2.8.97.js
          npm version 2.8.97 --no-git-tag-version
          npm --prefix realtime-server version 2.8.97 --no-git-tag-version
          node --check scripts/fetch-schedules.js
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fetch-schedules.js src/components/Footer.tsx package.json package-lock.json realtime-server/package.json
          git commit -m "fix(calendar): protect authoritative crews in v2.8.97"
          git push
