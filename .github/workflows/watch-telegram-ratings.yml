name: Watch Telegram Ratings

on:
  schedule:
    # Morning polling (09:00-09:15 IST) is now handled by Vercel Cron (vercel.json).
    # This workflow keeps only the evening safety sweep for late/holiday Scopt posts.
    - cron: '30 15-20 * * *' # evening safety sweep for holiday/late posts (18:30-23:30 IST)
  workflow_dispatch:
    inputs:
      expectedDate:
        description: 'Ratings date in YYYY-MM-DD, defaults to yesterday in Israel'
        required: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Poll Vercel Telegram ratings cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXPECTED_DATE: ${{ github.event.inputs.expectedDate }}
          WATCH_MINUTES: 20
          POLL_INTERVAL_SECONDS: 60
        run: node scripts/poll-telegram-ratings-cron.mjs

