name: Diagnose Herzliya Crew Source

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diagnose-herzliya.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin puppeteer-core @sparticuz/chromium
      - name: Probe hidden department calendar
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');
          const puppeteer = require('puppeteer-core');
          const chromiumModule = require('@sparticuz/chromium');
          const chromium = chromiumModule.default || chromiumModule;
          initializeApp({ credential: cert({ projectId: process.env.FIREBASE_PROJECT_ID, clientEmail: process.env.FIREBASE_CLIENT_EMAIL, privateKey: process.env.FIREBASE_PRIVATE_KEY.replace(/\\n/g, '\n') }) });
          const db = getFirestore();
          const redact = value => String(value || '').replace(/[0-9a-f]{8}-[0-9a-f-]{27,}/gi, '<uuid>').replace(/A=[^&"'\s]+/gi, 'A=<token>');
          (async () => {
            const saved = (await db.collection('user_calendar_sync').get()).docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const target = saved.find(item => /ירון אורבך/.test(item.workerName || ''));
            if (!target?.url) throw new Error('Yaron saved calendar URL not found');
            const browser = await puppeteer.launch({ args: [...chromium.args, '--ignore-certificate-errors'], defaultViewport: { width: 1280, height: 900 }, executablePath: await chromium.executablePath(), headless: chromium.headless });
            const page = await browser.newPage();
            await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await new Promise(resolve => setTimeout(resolve, 5000));
            const departmentUrl = new URL(page.url());
            departmentUrl.searchParams.set('prgname', 'ShowEmp6');
            const args = departmentUrl.searchParams.get('arguments') || '';
            departmentUrl.searchParams.set('arguments', args.endsWith(',-Atrue') ? args : `${args},-Atrue`);
            await page.goto(departmentUrl.toString(), { waitUntil: 'domcontentloaded', timeout: 45000 });
            await new Promise(resolve => setTimeout(resolve, 8000));
            const department = await page.evaluate(() => ({
              href: location.href,
              bodyText: (document.body?.innerText || '').slice(0, 5000),
              events: [...document.querySelectorAll('.event,.sat,[onclick*=openmd2]')].map((element, index) => ({ index, className: element.className, onclick: element.getAttribute('onclick'), text: (element.textContent || '').replace(/\s+/g, ' ').trim(), html: element.outerHTML })),
              openmd2Count: document.querySelectorAll('[onclick*=openmd2]').length,
            }));
            const popupChecks = [];
            for (const event of department.events) {
              const match = String(event.onclick || '').match(/openmd2\((\d+)\)/);
              if (!match) continue;
              const popupUrl = new URL(departmentUrl);
              popupUrl.searchParams.set('prgname', 'ShowCrew');
              popupUrl.searchParams.set('arguments', `-N${match[1]}`);
              const popupPage = await browser.newPage();
              const response = await popupPage.goto(popupUrl.toString(), { waitUntil: 'domcontentloaded', timeout: 30000 });
              const popup = await popupPage.evaluate(() => ({ textLength: (document.body?.innerText || '').length, tableCount: document.querySelectorAll('table').length, rowCount: document.querySelectorAll('tr').length, phoneCount: ((document.body?.innerText || '').match(/0\d{1,2}[-\s]?\d{3}[-\s]?\d{4}/g) || []).length }));
              popupChecks.push({ productionId: match[1], status: response?.status(), eventText: event.text, ...popup });
              await popupPage.close();
              if (popupChecks.length >= 30) break;
            }
            const sanitized = JSON.parse(redact(JSON.stringify({ generatedAt: new Date().toISOString(), department, popupChecks })));
            fs.mkdirSync('.github/diagnostics', { recursive: true });
            fs.writeFileSync('.github/diagnostics/herzliya-structure.json', JSON.stringify(sanitized, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Persist sanitized diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/herzliya-structure.json
          git commit -m "chore(calendar): capture hidden department endpoint"
          git push
