name: Deploy Calendar Empty Week Hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-calendar-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply hotfix and bump version
        run: node scripts/apply-calendar-empty-week-hotfix.js

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and push v2.8.88
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fetch-schedules.js package.json package-lock.json realtime-server/package.json src/components/Footer.tsx
          git commit -m 'fix: reconcile empty and malformed calendars in v2.8.88'
          git push origin master

      - name: Sync saved calendars now
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SYNC_SAVED_CALENDARS: '1'
        run: node scripts/fetch-schedules.js
