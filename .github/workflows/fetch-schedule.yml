name: Fetch Production Schedule

on:
  workflow_dispatch:        # manual trigger for testing
  repository_dispatch:
    types: [fetch-schedule] # can be triggered via API

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Trigger Vercel calendar sync cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/poll-calendar-sync-cron.mjs
